---
# tasks file for haproxy

- name: Installing haproxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Install SELinux management tools and Python bindings
  ansible.builtin.dnf:
    name:
      - python3-libsemanage
      - policycoreutils-python-utils
    state: present

- name: Start the Haproxy Load balancer
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true

- name: deploy haproxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
    validate: haproxy -c -f %s
  notify: reload haproxy

