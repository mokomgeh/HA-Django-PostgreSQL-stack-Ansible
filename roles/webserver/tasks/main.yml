  #######     Gunicorn stuff    ##############

- name: Install Gunicorm systemd unit from template
  ansible.builtin.template:
    src: gunicorn.service.j2
    dest: /etc/systemd/system/gunicorn.service
    mode: "0644"
  notify:
    - reload systemd
    - restart gunicorn

- name: Enable and start Gunicorn
  ansible.builtin.service:
    name: gunicorn
    state: started
    enabled: true
  

########## Nginx stuff ################
- name: Install Nginx site configuration
  ansible.builtin.template:
    src: nginx-django.conf.j2
    dest: /etc/nginx/conf.d/django.conf
    mode: "0644"
  notify: reload nginx

- name: Remove the default Nginx welcome page (if present)
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: reload nginx

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true


- name: Allow HTTP through firewalld
  firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true