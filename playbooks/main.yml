---
- name: Baseline configuration on every node (users, packages, time, updates)
  hosts: all              
  become: true      
  gather_facts: true
  roles:
    - common

# Selinux and firewalld role
- name: SELinux and Firewalld hardening on every node
  hosts: all
  become: true
  gather_facts: true
  roles:
    - selinux_firewalld


# Database Role 
- name: Configure PostgreSQL database server
  hosts: database
  become: true
  gather_facts: true
  roles:
    - database
        
# Webservers role        
- name: Configure Django Webservers
  hosts: webservers
  become: true
  gather_facts: true
  roles:
    - webserver

# Load balancer role
- name: "Configure the HAProxy load balancer"
  hosts: loadbalancer
  become: true
  gather_facts: true
  roles:
    - haproxy

        